[project]
name = "integration-hub"
version = "0.1.0"
description = "Centralize, execute and troubleshoot integrations with external REST APIs."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "httpx==0.28.1",
    "cryptography==50.0.1",
    "python-json-logger==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    # Required by starlette.testclient; the app itself uses httpx.
    "httpx2==2.12.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# There is a local `alembic/` directory; without this ruff sorts the library as first-party.
known-third-party = ["alembic"]
