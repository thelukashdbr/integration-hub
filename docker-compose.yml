services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: integration_hub
      POSTGRES_PASSWORD: integration_hub
      POSTGRES_DB: integration_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate database the test suite uses.
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://integration_hub:integration_hub@postgres:5432/integration_hub
      TEST_DATABASE_URL: postgresql+psycopg://integration_hub:integration_hub@postgres:5432/integration_hub_test
    # Migrations run on every start so a fresh clone is usable with a single command.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
